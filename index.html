<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awde Negest Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Top Bar with Contact & Language -->
        <div class="top-bar">
            <a href="https://linktr.ee/yohannesbiotech" target="_blank" class="contact-btn" id="t-contactBtn">ያግኙን</a>
            <div class="lang-switcher">
                <select id="languageSelect" onchange="switchLanguage()">
                    <option value="am" selected>አማርኛ (Amharic)</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>

        <h1 id="t-title">ዓውደ ነገሥት</h1>
        <p class="subtitle" id="t-subtitle">ጥንታዊ የኢትዮጵያ ኮከብ ቆጠራ</p>

        <div class="input-group">
            <label for="personName" id="t-nameLabel">የእርስዎ ስም</label>
            <div class="input-wrapper">
                <input type="text" id="personName" placeholder="ስም ያስገቡ...">
                <button class="kbd-btn" onclick="openKeyboardFor('personName')" title="Virtual Keyboard">⌨️</button>
            </div>
        </div>

        <div class="input-group">
            <label for="motherName" id="t-motherLabel">የእናት ስም</label>
            <div class="input-wrapper">
                <input type="text" id="motherName" placeholder="የእናት ስም ያስገቡ...">
                <button class="kbd-btn" onclick="openKeyboardFor('motherName')" title="Virtual Keyboard">⌨️</button>
            </div>
        </div>

        <button id="calculateBtn" onclick="calculateAstrology()">
            <span id="t-calcBtn">ኮከብ አስላ</span>
        </button>
        <button id="clearBtn" onclick="clearInputs()">
            <span id="t-clearBtn">አጥፋ</span>
        </button>

        <div id="resultBox" class="hidden"></div>

        <!-- Footer Developer Link -->
        <div class="footer">
            <a href="https://linktr.ee/yohannesbiotech" target="_blank" id="t-developerLink">አበልጻጊውን ያግኙ</a>
        </div>
    </div>

    <!-- Custom Amharic Keyboard -->
    <div id="keyboard" class="keyboard hidden">
        <div class="keyboard-header">
            <button class="close-btn" id="closeKeyboard" onclick="closeKeyboard()">❌ ኪቦርድ ዝጋ</button>
            <button class="enter-btn" onclick="keyboardEnter()" id="t-enterBtn">አስገባ ⏎</button>
            <button class="backspace-btn" onclick="backspace()" id="t-backspaceBtn">⌫ አጥፋ</button>
        </div>
        <div id="keysContainer" class="keys-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
